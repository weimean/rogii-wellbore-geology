[project]
name = "rogii-wellbore-geology"
version = "0.1.0"
description = "Kaggle — ROGII Wellbore Geology Prediction (TVT regression via GR log correlation)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",          # cross-correlation / signal alignment for GR curves
    "scikit-learn>=1.5",    # GroupKFold, metrics, baselines
    "matplotlib>=3.9",      # log & cross-section plotting
    "pyyaml>=6.0",          # config files
    "tqdm>=4.66",
]

[dependency-groups]
# installed with `uv sync` for local dev; keep out of the Kaggle submission kernel
dev = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "ruff>=0.6",
    "kaggle>=1.6",          # data download CLI
]

[tool.ruff]
line-length = 100

[tool.uv]
package = false
